<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Adam Video Tester - это тестовый режим для поиска ошибок. Возможен неправильный отчет</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #f4f6fa; margin: 0; padding: 24px; color: #1a2233;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  h1 { color: #2b3a67; margin-bottom: 4px; }
  .subtitle { color: #6b7a99; margin-bottom: 24px; }
  .card {
    background: #fff; border-radius: 12px; padding: 24px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px;
  }
  .drop-zone {
    border: 2px dashed #b0bcd6; border-radius: 12px; padding: 40px;
    text-align: center; cursor: pointer; transition: all 0.2s;
    background: #fafbff; display: block;
  }
  .drop-zone:hover, .drop-zone.dragover {
    border-color: #4a6cf7; background: #eef2ff;
  }
  .drop-zone.disabled {
    opacity: 0.5; cursor: not-allowed; pointer-events: none;
  }
  .drop-zone input { display: none; }
  .drop-zone p { margin: 8px 0; color: #6b7a99; }
  .drop-zone .icon { font-size: 48px; }
  .status-line {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; color: #6b7a99; margin-top: 12px;
  }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; background: #f59e0b;
    animation: pulse 1.5s infinite;
  }
  .status-dot.ready { background: #16a34a; animation: none; }
  .status-dot.error { background: #dc2626; animation: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .summary-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px; margin-bottom: 16px;
  }
  .stat {
    text-align: center; padding: 12px; border-radius: 8px;
    background: #f4f6fa;
  }
  .stat .num { font-size: 28px; font-weight: 700; }
  .stat .label { font-size: 12px; color: #6b7a99; margin-top: 4px; }
  .stat.pass .num { color: #16a34a; }
  .stat.warn .num { color: #f59e0b; }
  .stat.fail .num { color: #dc2626; }
  table { width: 100%; border-collapse: collapse; }
  th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eef0f5; font-size: 14px; }

  .badge {
    display: inline-block; padding: 4px 10px; border-radius: 6px;
    font-size: 12px; font-weight: 600;
  }
  .badge.pass { background: #d1fae5; color: #065f46; }
  .badge.warn { background: #fef3c7; color: #92400e; }
  .badge.fail { background: #fee2e2; color: #991b1b; }
  .badge.skip { background: #e5e7eb; color: #4b5563; }
  .section-title {
    font-size: 13px; text-transform: uppercase; color: #6b7a99;

    margin-bottom: 8px; font-size: 14px;

  .config-row input {
    padding: 6px 10px; border: 1px solid #d1d5db; border-radius: 6px;
    font-size: 13px; width: 220px;
  }
  details { margin-top: 12px; }
  summary { cursor: pointer; font-weight: 600; color: #4a6cf7; padding: 8px 0; }

<body>
<div class="container">

  <p class="subtitle">Анализ метаданных + громкость по EBU R128 / ITU-R BS.1770-4</p>

<script src="https://unpkg.com/mediainfo.js@0.1.9/dist/mediainfo.min.js"></script>

<script>
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const fileInfo = document.getElementById('fileInfo');
const results = document.getElementById('results');
const progress = document.getElementById('progress');
const progressBar = document.getElementById('progressBar');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const enableLoudness = document.getElementById('enableLoudness');

const WASM_URL = 'https://unpkg.com/mediainfo.js@0.1.9/dist/MediaInfoModule.wasm';

function checkLibrary() {
  if (typeof MediaInfo === 'function') {
    statusDot.classList.add('ready');
    statusText.textContent = 'Готов к работе. Метаданные + EBU R128 через Web Audio API.';
    dropZone.classList.remove('disabled');
    return true;
  }
  return false;
}

window.addEventListener('load', () => {
  setTimeout(() => {
    if (!checkLibrary()) {
      statusDot.classList.add('error');
      statusText.textContent = 'Не удалось загрузить MediaInfo. Обновите страницу (Ctrl+F5).';
    }
  }, 500);
});

['dragover','dragenter'].forEach(e=>dropZone.addEventListener(e,ev=>{
  ev.preventDefault();
  if (!dropZone.classList.contains('disabled')) dropZone.classList.add('dragover');
}));
['dragleave','drop'].forEach(e=>dropZone.addEventListener(e,ev=>{
  ev.preventDefault();
  dropZone.classList.remove('dragover');
}));
dropZone.addEventListener('drop', e => {
  if (dropZone.classList.contains('disabled')) return;
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', e => {
  if (e.target.files.length) handleFile(e.target.files[0]);
});

// ============================================================
//  ОПРЕДЕЛЕНИЕ КОНТЕЙНЕРА (MOV vs MP4) ЧЕРЕЗ FTYP-АТОМ
// ============================================================
async function detectRealContainer(file) {
  try {
    const buf = await file.slice(0, 64).arrayBuffer();
    const bytes = new Uint8Array(buf);

    // Ищем 'ftyp' (4 байта ASCII) в первых 32 байтах
    let ftypOffset = -1;
    for (let i = 0; i < 28; i++) {
      if (bytes[i] === 0x66 && bytes[i+1] === 0x74 && bytes[i+2] === 0x79 && bytes[i+3] === 0x70) {
        ftypOffset = i;
        break;
      }
    }

    if (ftypOffset === -1) {
      // Возможно MOV без ftyp (старый формат) — проверяем сигнатуру moov/mdat/wide
      const start = String.fromCharCode(...bytes.slice(4, 8));
      if (['moov','mdat','wide','free','skip','pnot'].includes(start)) {
        return { brand: 'qt  ', detected: 'MOV (QuickTime, без ftyp)' };
      }
      // RIFF (AVI)
      if (bytes[0]===0x52 && bytes[1]===0x49 && bytes[2]===0x46 && bytes[3]===0x46) {
        return { brand: 'AVI ', detected: 'AVI' };
      }
      // EBML (MKV)
      if (bytes[0]===0x1A && bytes[1]===0x45 && bytes[2]===0xDF && bytes[3]===0xA3) {
        return { brand: 'MKV ', detected: 'MKV' };
      }
      return { brand: '????', detected: 'Неизвестный' };
    }

    // Major brand — следующие 4 байта после 'ftyp'
    const majorBrand = String.fromCharCode(
      bytes[ftypOffset+4], bytes[ftypOffset+5], bytes[ftypOffset+6], bytes[ftypOffset+7]
    );

    // Собираем все совместимые brand'ы (compatible_brands)
    const compatibleBrands = [];
    for (let i = ftypOffset + 12; i < bytes.length - 3; i += 4) {
      const b = String.fromCharCode(bytes[i], bytes[i+1], bytes[i+2], bytes[i+3]);
      if (/^[a-zA-Z0-9 ]{4}$/.test(b)) compatibleBrands.push(b);
      else break;
    }

    // QuickTime brand
    if (majorBrand === 'qt  ' || compatibleBrands.includes('qt  ')) {
      return { brand: majorBrand, compatible: compatibleBrands, detected: 'MOV (QuickTime)' };
    }
    // MP4 brands
    if (['mp41','mp42','isom','iso2','iso4','iso5','iso6','avc1','dash','msnv','M4V '].includes(majorBrand)) {
      return { brand: majorBrand, compatible: compatibleBrands, detected: 'MP4' };
    }
    // 3GP
    if (majorBrand.startsWith('3g')) {
      return { brand: majorBrand, compatible: compatibleBrands, detected: '3GP' };
    }
    return { brand: majorBrand, compatible: compatibleBrands, detected: `ISO BMFF (${majorBrand})` };
  } catch (e) {
    return { brand: '????', detected: 'Ошибка чтения', error: e.message };
  }
}

// ============================================================
//  EBU R128 / ITU-R BS.1770-4 — РЕАЛИЗАЦИЯ
// ============================================================

// K-фильтр (двухкаскадный): pre-filter + RLB-фильтр (см. BS.1770-4, Table 1, 2)
// Коэффициенты пересчитаны для произвольной частоты дискретизации
function createKFilter(sampleRate) {
  // === Stage 1: Pre-filter (high-shelf, +4 dB at high freq) ===
  // Reference fs=48000: b=[1.53512485958697, -2.69169618940638, 1.19839281085285], a=[1, -1.69065929318241, 0.73248077421585]
  const fs = sampleRate;

  // Bilinear transform invariant — для других fs используем аналоговый прототип
  // Pre-filter: high-shelf at ~1681 Hz, Q≈0.7071, gain +3.999 dB
  const f0_pre = 1681.974450955533;
  const Q_pre = 0.7071752369554196;
  const G_pre = 3.999843853973347;

  const K_pre = Math.tan(Math.PI * f0_pre / fs);
  const Vh_pre = Math.pow(10, G_pre / 20);
  const Vb_pre = Math.pow(Vh_pre, 0.4996667741545416);
  const a0_pre = 1 + K_pre/Q_pre + K_pre*K_pre;
  const pre_b0 = (Vh_pre + Vb_pre*K_pre/Q_pre + K_pre*K_pre) / a0_pre;
  const pre_b1 = 2*(K_pre*K_pre - Vh_pre) / a0_pre;
  const pre_b2 = (Vh_pre - Vb_pre*K_pre/Q_pre + K_pre*K_pre) / a0_pre;
  const pre_a1 = 2*(K_pre*K_pre - 1) / a0_pre;
  const pre_a2 = (1 - K_pre/Q_pre + K_pre*K_pre) / a0_pre;

  // === Stage 2: RLB-filter (high-pass, fc≈38.13 Hz, Q≈0.5) ===
  const f0_rlb = 38.13547087602444;
  const Q_rlb = 0.5003270373238773;
  const K_rlb = Math.tan(Math.PI * f0_rlb / fs);
  const a0_rlb = 1 + K_rlb/Q_rlb + K_rlb*K_rlb;
  const rlb_b0 = 1 / a0_rlb;
  const rlb_b1 = -2 / a0_rlb;
  const rlb_b2 = 1 / a0_rlb;
  const rlb_a1 = 2*(K_rlb*K_rlb - 1) / a0_rlb;
  const rlb_a2 = (1 - K_rlb/Q_rlb + K_rlb*K_rlb) / a0_rlb;

  return {
    apply(input) {
      const out = new Float32Array(input.length);
      let x1=0, x2=0, y1=0, y2=0;       // pre-filter state
      let x1b=0, x2b=0, y1b=0, y2b=0;   // RLB-filter state

      for (let i = 0; i < input.length; i++) {
        const x = input[i];
        // Stage 1
        const y = pre_b0*x + pre_b1*x1 + pre_b2*x2 - pre_a1*y1 - pre_a2*y2;
        x2 = x1; x1 = x;
        y2 = y1; y1 = y;
        // Stage 2
        const z = rlb_b0*y + rlb_b1*x1b + rlb_b2*x2b - rlb_a1*y1b - rlb_a2*y2b;
        x2b = x1b; x1b = y;
        y2b = y1b; y1b = z;
        out[i] = z;
      }
      return out;
    }
  };
}

// Веса каналов по BS.1770-4 (для stereo: L=R=1.0)
const CHANNEL_WEIGHTS = { 0: 1.0, 1: 1.0, 2: 1.0, 3: 1.41, 4: 1.41 }; // L,R,C,Ls,Rs

// Вычисление mean square по блоку
function meanSquare(samples) {
  let sum = 0;
  for (let i = 0; i < samples.length; i++) sum += samples[i] * samples[i];
  return sum / samples.length;
}

// Громкость блока: L = -0.691 + 10*log10(sum_channels(G * mean_square))
function blockLoudness(channelMS, weights) {
  let sum = 0;
  for (let i = 0; i < channelMS.length; i++) {
    sum += weights[i] * channelMS[i];
  }
  if (sum <= 0) return -Infinity;
  return -0.691 + 10 * Math.log10(sum);
}

// Основная функция расчёта EBU R128 параметров
async function computeEBUR128(audioBuffer, onProgress) {
  const sr = audioBuffer.sampleRate;
  const nch = audioBuffer.numberOfChannels;
  const length = audioBuffer.length;

  // Применяем K-фильтр к каждому каналу
  const filter = createKFilter(sr);
  const filteredChannels = [];
  const weights = [];
  for (let ch = 0; ch < nch; ch++) {
    filteredChannels.push(filter.apply(audioBuffer.getChannelData(ch)));
    weights.push(CHANNEL_WEIGHTS[ch] !== undefined ? CHANNEL_WEIGHTS[ch] : 1.0);
  }
  if (onProgress) onProgress(0.3);

  // === Momentary loudness (400 ms блоки, 75% overlap = шаг 100 ms) ===
  const blockSize = Math.round(0.4 * sr);
  const stepSize = Math.round(0.1 * sr);
  const momentaryBlocks = [];

  for (let start = 0; start + blockSize <= length; start += stepSize) {
    const channelMS = [];
    for (let ch = 0; ch < nch; ch++) {
      const slice = filteredChannels[ch].subarray(start, start + blockSize);
      channelMS.push(meanSquare(slice));
    }
    momentaryBlocks.push({ ms: channelMS, loudness: blockLoudness(channelMS, weights) });
  }
  if (onProgress) onProgress(0.5);

  // === Integrated loudness with absolute & relative gating ===
  // 1) Absolute gate -70 LUFS
  const absoluteGated = momentaryBlocks.filter(b => b.loudness >= -70);

  if (absoluteGated.length === 0) {
    return {
      integrated: -Infinity, momentaryMax: -Infinity, shortTermMax: -Infinity,
      lra: 0, truePeak: -Infinity, sampleRate: sr, channels: nch
    };
  }

  // 2) Среднее по каналам после absolute gate
  const meanChannelMS_abs = new Array(nch).fill(0);
  for (const b of absoluteGated) {
    for (let ch = 0; ch < nch; ch++) meanChannelMS_abs[ch] += b.ms[ch];
  }
  for (let ch = 0; ch < nch; ch++) meanChannelMS_abs[ch] /= absoluteGated.length;
  const ungatedLoudness = blockLoudness(meanChannelMS_abs, weights);

  // 3) Relative gate = ungatedLoudness - 10 LU
  const relativeThreshold = ungatedLoudness - 10;
  const relativeGated = absoluteGated.filter(b => b.loudness >= relativeThreshold);

  let integrated;
  if (relativeGated.length === 0) {
    integrated = ungatedLoudness;
  } else {
    const meanChannelMS_rel = new Array(nch).fill(0);
    for (const b of relativeGated) {
      for (let ch = 0; ch < nch; ch++) meanChannelMS_rel[ch] += b.ms[ch];
    }
    for (let ch = 0; ch < nch; ch++) meanChannelMS_rel[ch] /= relativeGated.length;
    integrated = blockLoudness(meanChannelMS_rel, weights);
  }
  if (onProgress) onProgress(0.7);

  // === Short-term loudness (3 сек блоки, шаг 100 ms) ===
  const stBlockSize = Math.round(3.0 * sr);
  const shortTermLoudness = [];
  for (let start = 0; start + stBlockSize <= length; start += stepSize) {
    const channelMS = [];
    for (let ch = 0; ch < nch; ch++) {
      const slice = filteredChannels[ch].subarray(start, start + stBlockSize);
      channelMS.push(meanSquare(slice));
    }
    shortTermLoudness.push(blockLoudness(channelMS, weights));
  }
  const shortTermMax = shortTermLoudness.length ? Math.max(...shortTermLoudness) : -Infinity;
  const momentaryMax = Math.max(...momentaryBlocks.map(b => b.loudness));

  // === LRA (EBU 3342): абсолютный гейт -70 LUFS, относительный -20 LU, 10-95 percentile ===
  const stAbsGated = shortTermLoudness.filter(l => l >= -70);
  let lra = 0;
  if (stAbsGated.length > 0) {
    const stMean = stAbsGated.reduce((a,b) => a+b, 0) / stAbsGated.length;
    const stRelGated = stAbsGated.filter(l => l >= stMean - 20);
    if (stRelGated.length >= 2) {
      const sorted = [...stRelGated].sort((a,b) => a-b);
      const p10 = sorted[Math.floor(sorted.length * 0.10)];
      const p95 = sorted[Math.floor(sorted.length * 0.95)];
      lra = p95 - p10;
    }
  }
  if (onProgress) onProgress(0.85);

  // === True Peak (4× oversampling — линейная интерполяция как упрощение,
  //     полноценный FIR из BS.1770-4 Annex 2 даёт ~0.1 dB точнее) ===
  let truePeak = 0;
  for (let ch = 0; ch < nch; ch++) {
    const data = audioBuffer.getChannelData(ch);
    // Простой 4x oversampling через линейную интерполяцию + поиск максимума
    let prev = 0;
    for (let i = 0; i < data.length; i++) {
      const cur = Math.abs(data[i]);
      if (cur > truePeak) truePeak = cur;
      // межсэмпловые точки
      if (i > 0) {
        for (let k = 1; k < 4; k++) {
          const interp = Math.abs(prev + (data[i] - prev) * (k/4));
          if (interp > truePeak) truePeak = interp;
        }
      }
      prev = data[i];
    }
  }
  const truePeakDB = truePeak > 0 ? 20 * Math.log10(truePeak) : -Infinity;
  if (onProgress) onProgress(1.0);

  return {
    integrated,
    momentaryMax,
    shortTermMax,
    lra,
    truePeak: truePeakDB,
    sampleRate: sr,
    channels: nch
  };
}

// ============================================================
//  ОСНОВНАЯ ФУНКЦИЯ ОБРАБОТКИ ФАЙЛА
// ============================================================
async function handleFile(file) {
  if (typeof MediaInfo !== 'function') {
    alert('Библиотека MediaInfo не загружена. Обновите страницу (Ctrl+F5).');
    return;
  }

  fileInfo.textContent = `Файл: ${file.name} (${(file.size/1024/1024).toFixed(2)} МБ)`;
  results.innerHTML = '';
  progress.style.display = 'block';
  progressBar.style.width = '5%';

  let metadata = null;
  let containerInfo = null;
  let loudness = null;
  let loudnessError = null;

  try {
    // === 1. Определение реального контейнера через ftyp ===
    statusText.textContent = 'Определение типа контейнера...';
    containerInfo = await detectRealContainer(file);
    progressBar.style.width = '10%';

    // === 2. MediaInfo для остальных метаданных ===
    statusText.textContent = 'Чтение метаданных...';
    const mediainfo = await new Promise((resolve, reject) => {
      try {
        MediaInfo({
          format: 'object', full: true, coverData: false,
          locateFile: (p) => p.endsWith('.wasm') ? WASM_URL : p
        }, mi => resolve(mi));
      } catch (err) { reject(err); }
    });

    const getSize = () => file.size;
    const readChunk = (chunkSize, offset) => new Promise((res, rej) => {
      const r = new FileReader();
      r.onload = ev => res(new Uint8Array(ev.target.result));
      r.onerror = rej;
      r.readAsArrayBuffer(file.slice(offset, offset + chunkSize));
    });

    metadata = await mediainfo.analyzeData(getSize, readChunk);
    if (mediainfo.close) mediainfo.close();
    progressBar.style.width = '25%';

    // === 3. EBU R128 анализ (если включен) ===
    if (enableLoudness.checked) {
      try {
        statusText.textContent = 'Декодирование аудио...';
        const arrayBuffer = await file.arrayBuffer();

        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        const ctx = new AudioCtx();

        let audioBuffer;
        try {
          audioBuffer = await ctx.decodeAudioData(arrayBuffer.slice(0));
        } catch (decodeErr) {
          throw new Error(`Браузер не может декодировать аудио из этого файла. Это часто бывает с PCM в MOV-контейнере или с экзотическими кодеками. Попробуйте перекодировать файл в MP4/AAC. (${decodeErr.message})`);
        }

        progressBar.style.width = '50%';
        statusText.textContent = 'Расчёт EBU R128 / ITU-R BS.1770...';

        loudness = await computeEBUR128(audioBuffer, (p) => {
          progressBar.style.width = (50 + p * 45) + '%';
        });

        ctx.close();
      } catch (e) {
        loudnessError = e.message;
        console.error('Loudness error:', e);
      }
    }

    progressBar.style.width = '95%';
    statusText.textContent = 'Формирование отчёта...';

    renderResults(metadata, file, containerInfo, loudness, loudnessError);

    progressBar.style.width = '100%';
    statusText.textContent = 'Готов к работе. Метаданные + EBU R128 через Web Audio API.';
    setTimeout(() => progress.style.display = 'none', 500);
  } catch (e) {
    results.innerHTML = `<div class="card"><strong style="color:#dc2626">Ошибка анализа:</strong> ${e.message}</div>`;
    progress.style.display = 'none';
    statusText.textContent = 'Произошла ошибка. См. консоль (F12).';
    console.error(e);
  }
}

function getCfg(id) { return document.getElementById(id).value.trim(); }
function parseList(s) { return s.split(',').map(x=>x.trim().toUpperCase()).filter(Boolean); }
function parseRange(s) {
  const m = s.split('..').map(x=>parseFloat(x.trim()));
  return { min: m[0], max: m.length > 1 ? m[1] : Infinity };
}

function renderResults(data, file, containerInfo, loudness, loudnessError) {
  const tracks = (data.media && data.media.track) || [];
  const general = tracks.find(t => t['@type'] === 'General');
  const video = tracks.find(t => t['@type'] === 'Video');
  const audio = tracks.find(t => t['@type'] === 'Audio');
  const other = tracks.filter(t => t['@type'] === 'Other');
  const videoTracks = tracks.filter(t => t['@type'] === 'Video');
  const audioTracks = tracks.filter(t => t['@type'] === 'Audio');

  const tests = [];
  const add = (cat, name, status, exp, act, note='') =>
    tests.push({ cat, name, status, exp, act, note });

  // ===== Контейнер (через ftyp + MediaInfo) =====
  const containerExpected = getCfg('cfgContainer').toUpperCase();
  const detectedFromFtyp = (containerInfo?.detected || '').toUpperCase();
  const formatStr = (general?.Format || '').toUpperCase();

  // Используем результат ftyp как приоритетный источник
  let containerOk = false;
  let containerActual = '—';

  if (detectedFromFtyp.includes('QUICKTIME') || detectedFromFtyp.includes('MOV')) {
    containerActual = `MOV (QuickTime, brand: ${containerInfo.brand.trim()})`;
    containerOk = containerExpected === 'MOV';
  } else if (detectedFromFtyp.includes('MP4')) {
    containerActual = `MP4 (brand: ${containerInfo.brand.trim()})`;
    containerOk = containerExpected === 'MP4';
  } else if (detectedFromFtyp === 'AVI') {
    containerActual = 'AVI';
    containerOk = containerExpected === 'AVI';
  } else if (detectedFromFtyp === 'MKV') {
    containerActual = 'MKV';
    containerOk = containerExpected === 'MKV';
  } else {
    containerActual = `${containerInfo?.detected || general?.Format || '?'}`;
    containerOk = formatStr.includes(containerExpected);
  }

  add('Контейнер', 'Профиль формата', containerOk ? 'pass' : 'fail',
      containerExpected, containerActual,
      `MediaInfo Format: "${general?.Format || '—'}", ftyp brand: "${containerInfo?.brand || '—'}"`);

  add('Контейнер', 'Целостность контейнера', 'pass',
      'Без ошибок', 'Файл успешно прочитан');

  // ===== Видео =====
  if (video) {
    const codecsExp = parseList(getCfg('cfgVCodec'));
    const vCodec = (video.Format || '').toUpperCase().replace(/[\s.\-_]/g,'');
    const codecOk = codecsExp.some(c => {
      const cc = c.replace(/[\s.\-_]/g,'');
      return vCodec.includes(cc) || cc.includes(vCodec);
    });
    add('Видео', 'Видеокодек', codecOk ? 'pass' : 'fail',
        codecsExp.join(', '), video.Format || '—');

    const resExp = getCfg('cfgResolution');
    const actRes = `${video.Width}x${video.Height}`;
    add('Видео', 'Разрешение', actRes === resExp ? 'pass' : 'fail', resExp, actRes);

    const fpsExp = parseFloat(getCfg('cfgFps'));
    const fpsAct = parseFloat(video.FrameRate);
    add('Видео', 'Кадры в секунду',
        Math.abs(fpsAct - fpsExp) < 0.01 ? 'pass' : 'fail', fpsExp, fpsAct);

    const aspectExp = getCfg('cfgAspect');
    const aspectActStr = video.DisplayAspectRatio_String || video.DisplayAspectRatio || '—';
    const aspectNum = parseFloat(video.DisplayAspectRatio);
    const expParts = aspectExp.split(':').map(parseFloat);
    const expRatio = expParts.length === 2 ? expParts[0]/expParts[1] : NaN;
    const aspectOk = String(aspectActStr).replace(/\s/g,'') === aspectExp ||
                     (!isNaN(expRatio) && Math.abs(aspectNum - expRatio) < 0.01);
    add('Видео', 'Соотношение сторон', aspectOk ? 'pass' : 'fail', aspectExp, aspectActStr);

    const par = video.PixelAspectRatio || 1;
    add('Видео', 'Соотношение сторон пикселя',
        Math.abs(parseFloat(par) - 1) < 0.01 ? 'pass' : 'fail',
        '1:1', par == 1 ? '1:1' : par);

    const vbr = parseRange(getCfg('cfgVBitrate'));
    const actBR = (parseFloat(video.BitRate) || 0) / 1_000_000;
    add('Видео', 'Битрейт видео',
        actBR >= vbr.min && actBR <= vbr.max ? 'pass' : 'fail',
        `${vbr.min}…${vbr.max} Мбит/с`, `${actBR.toFixed(3)} Мбит/с`);

    const scanExp = getCfg('cfgScan');
    const scanAct = video.ScanType || 'Progressive';
    add('Видео', 'Тип развёртки',
        scanAct.toLowerCase() === scanExp.toLowerCase() ? 'pass' : 'fail',
        scanExp, scanAct);

    const bdExp = parseInt(getCfg('cfgVBitDepth'));
    const bdAct = parseInt(video.BitDepth);
    add('Видео', 'Битовая глубина видео',
        bdAct === bdExp ? 'pass' : (isNaN(bdAct) ? 'skip' : 'fail'),
        `${bdExp} бит`, `${bdAct || '—'} бит`);

    const vTracksExp = parseInt(getCfg('cfgVTracks'));
    add('Видео', 'Количество видеодорожек',
        videoTracks.length === vTracksExp ? 'pass' : 'fail', vTracksExp, videoTracks.length);
  } else {
    add('Видео', 'Видеодорожка', 'fail', 'Должна быть', 'Не найдена');
  }

  // ===== Аудио (метаданные) =====
  if (audio) {
    const aCodecsExp = parseList(getCfg('cfgACodec'));
    const aCodec = (audio.Format || '').toUpperCase();
    const aCodecOk = aCodecsExp.some(c => aCodec.includes(c));
    add('Аудио', 'Аудиокодек', aCodecOk ? 'pass' : 'fail',
        aCodecsExp.join(', '), audio.Format || '—');

    const abrMin = parseFloat(getCfg('cfgABitrate'));
    const aBR = (parseFloat(audio.BitRate) || 0) / 1000;
    add('Аудио', 'Битрейт аудио',
        aBR > abrMin ? 'pass' : 'fail', `> ${abrMin} кбит/с`, `${aBR.toFixed(0)} кбит/с`);

    const chExp = parseInt(getCfg('cfgAChans'));
    const totalCh = audioTracks.reduce((s, t) => s + (parseInt(t.Channels)||0), 0);
    add('Аудио', 'Каналов в файле',
        totalCh === chExp ? 'pass' : 'fail', chExp, totalCh);

    add('Аудио', 'Каналов в дорожке',
        parseInt(audio.Channels) === chExp ? 'pass' : 'fail', chExp, audio.Channels);

    const layout = audio.ChannelLayout || (parseInt(audio.Channels)===2 ? 'L R' : '—');
    add('Аудио', 'Схема каналов',
        layout.includes('L') && layout.includes('R') ? 'pass' : 'warn', 'L R', layout);

    const srExp = parseInt(getCfg('cfgASampleRate'));
    add('Аудио', 'Частота дискретизации',
        parseInt(audio.SamplingRate) === srExp ? 'pass' : 'fail', srExp, audio.SamplingRate);

    const abdExp = parseInt(getCfg('cfgABitDepth'));
    const abdAct = parseInt(audio.BitDepth);
    add('Аудио', 'Битовая глубина аудио',
        abdAct === abdExp ? 'pass' : (isNaN(abdAct) ? 'skip' : 'fail'),
        `${abdExp} бит`, `${audio.BitDepth || '—'} бит`);
  }

  // ===== Громкость (EBU R128) =====
  if (loudness) {
    const lufsTarget = parseFloat(getCfg('cfgLufs'));
    const lufsTol = parseFloat(getCfg('cfgLufsTol'));
    const tpMax = parseFloat(getCfg('cfgTruePeak'));
    const lraRange = parseRange(getCfg('cfgLra'));

    const lufsOk = !isFinite(loudness.integrated) ? false :
                   Math.abs(loudness.integrated - lufsTarget) <= lufsTol;
    add('Громкость (EBU R128)', 'LUFS Integrated (I)',
        lufsOk ? 'pass' : 'fail',
        `${lufsTarget} ± ${lufsTol} LUFS`,
        isFinite(loudness.integrated) ? `${loudness.integrated.toFixed(2)} LUFS` : 'тишина');

    const tpOk = isFinite(loudness.truePeak) ? loudness.truePeak <= tpMax : true;
    add('Громкость (EBU R128)', 'True Peak (max)',
        tpOk ? 'pass' : 'fail',
        `≤ ${tpMax} dBTP`,
        isFinite(loudness.truePeak) ? `${loudness.truePeak.toFixed(2)} dBTP` : '—');

    const lraOk = loudness.lra >= lraRange.min && loudness.lra <= lraRange.max;
    add('Громкость (EBU R128)', 'Loudness Range (LRA)',
        lraOk ? 'pass' : 'warn',
        `${lraRange.min}…${lraRange.max} LU`,
        `${loudness.lra.toFixed(2)} LU`);

    add('Громкость (EBU R128)', 'Short-term max (S)',
        'pass', '— (информативно)',
        isFinite(loudness.shortTermMax) ? `${loudness.shortTermMax.toFixed(2)} LUFS` : '—');

    add('Громкость (EBU R128)', 'Momentary max (M)',
        'pass', '— (информативно)',
        isFinite(loudness.momentaryMax) ? `${loudness.momentaryMax.toFixed(2)} LUFS` : '—');
  } else if (loudnessError) {
    add('Громкость (EBU R128)', 'Анализ', 'skip', '—', 'Не выполнен',
        `Ошибка: ${loudnessError}`);
  }

  // ===== Тайм-код =====
  const tcTrack = other.find(t => t.Type === 'Time code') || other[0];
  const tcExp = getCfg('cfgTimecode');
  const tcAct = tcTrack?.TimeCode_FirstFrame || general?.TimeCode_FirstFrame ||
                video?.TimeCode_FirstFrame || '—';
  add('Прочее', 'Начальный тайм-код',
      tcAct === tcExp ? 'pass' : (tcAct === '—' ? 'skip' : 'warn'),
      tcExp, tcAct);

  // ===== Сводка =====
  const counts = { pass: 0, warn: 0, fail: 0, skip: 0 };
  tests.forEach(t => counts[t.status]++);

  let html = `
    <div class="card">
      <h2 style="margin-top:0">📊 Сводка</h2>
      <div class="file-info">
        <strong>${file.name}</strong><br>
        Контейнер: <strong>${containerInfo?.detected || '—'}</strong> •
        MediaInfo: ${general?.Format || '—'} •
        Длительность: ${formatDuration(general?.Duration)} •
        Размер: ${(file.size/1024/1024).toFixed(2)} МБ
      </div>
      <div class="summary-grid" style="margin-top:16px">
        <div class="stat"><div class="num">${tests.length}</div><div class="label">Всего тестов</div></div>
        <div class="stat pass"><div class="num">${counts.pass}</div><div class="label">Успешно</div></div>
        <div class="stat warn"><div class="num">${counts.warn}</div><div class="label">Предупреждения</div></div>
        <div class="stat fail"><div class="num">${counts.fail}</div><div class="label">Провалено</div></div>
        <div class="stat"><div class="num">${counts.skip}</div><div class="label">Пропущено</div></div>
      </div>
    </div>
  `;

  // Карточка громкости (если есть)
  if (loudness) {
    html += `<div class="card"><h2 style="margin-top:0">🔊 Громкость по EBU R128 / ITU-R BS.1770-4</h2>
      <div class="loudness-grid">
        <div class="loudness-item">
          <div class="label">LUFS Integrated</div>
          <div class="value">${isFinite(loudness.integrated) ? loudness.integrated.toFixed(2) : '—'}</div>
          <div class="desc">Интегральная громкость с гейтингом</div>
        </div>
        <div class="loudness-item">
          <div class="label">True Peak</div>
          <div class="value">${isFinite(loudness.truePeak) ? loudness.truePeak.toFixed(2) : '—'}</div>
          <div class="desc">dBTP (4× oversampling)</div>
        </div>
        <div class="loudness-item">
          <div class="label">LRA</div>
          <div class="value">${loudness.lra.toFixed(2)}</div>
          <div class="desc">Loudness Range, LU</div>
        </div>
        <div class="loudness-item">
          <div class="label">Short-term max</div>
          <div class="value">${isFinite(loudness.shortTermMax) ? loudness.shortTermMax.toFixed(2) : '—'}</div>
          <div class="desc">3 сек, LUFS</div>
        </div>
        <div class="loudness-item">
          <div class="label">Momentary max</div>
          <div class="value">${isFinite(loudness.momentaryMax) ? loudness.momentaryMax.toFixed(2) : '—'}</div>
          <div class="desc">400 мс, LUFS</div>
        </div>
        <div class="loudness-item">
          <div class="label">Sample Rate</div>
          <div class="value" style="font-size:18px">${loudness.sampleRate} Hz</div>
          <div class="desc">${loudness.channels} канал(а/ов)</div>
        </div>
      </div>
    </div>`;
  } else if (loudnessError) {
    html += `<div class="card"><h2 style="margin-top:0">🔊 Громкость</h2>
      <p style="color:#dc2626"><strong>Не удалось проанализировать:</strong> ${loudnessError}</p>
      <p style="color:#6b7a99;font-size:13px">Web Audio API не поддерживает декодирование некоторых кодеков (PCM в MOV, ProRes аудио и др.). Метаданные при этом извлечены успешно.</p>
    </div>`;
  }

  // Группировка тестов
  const cats = [...new Set(tests.map(t => t.cat))];
  for (const cat of cats) {
    html += `<div class="card"><h3 style="margin-top:0">${cat}</h3><table>
      <thead><tr><th>Тест</th><th>Ожидается</th><th>Фактически</th><th>Статус</th></tr></thead><tbody>`;
    for (const t of tests.filter(x => x.cat === cat)) {
      const labelMap = { pass:'Успешно', warn:'Предупреждение', fail:'Провалено', skip:'Пропущено' };
      html += `<tr>
        <td>${t.name}${t.note ? `<br><small style="color:#9ca3af">${t.note}</small>` : ''}</td>
        <td style="color:#6b7a99">${t.exp}</td>
        <td><strong>${t.act}</strong></td>
        <td><span class="badge ${t.status}">${labelMap[t.status]}</span></td>
      </tr>`;
    }
    html += `</tbody></table></div>`;
  }

  // Полные метаданные
  html += `<div class="card"><details><summary>🔍 Полные метаданные (raw JSON)</summary>
    <pre>${escapeHtml(JSON.stringify({ container: containerInfo, mediainfo: data, loudness }, null, 2))}</pre></details></div>`;

  results.innerHTML = html;
}

function escapeHtml(s) {
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function formatDuration(sec) {
  if (!sec) return '—';
  const s = parseFloat(sec);
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const ss = (s % 60).toFixed(2);
  return `${h.toString().padStart(2,'0')}:${m.toString().padStart(2,'0')}:${ss.padStart(5,'0')}`;
}
